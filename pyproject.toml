[project]
name = "vocavault"
version = "0.2.0"
requires-python = ">=3.13"
description = "A local desktop library for virtual singer projects"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "PySide6>=6.8,<7",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
vocavault = "vocavault.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocavault"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "docs", "LICENSE", "licenses", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
